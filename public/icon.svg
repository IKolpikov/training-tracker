<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Training Tracker">
  <rect width="512" height="512" fill="#ffffff"/>
  <!-- Head — solid oval, slightly tilted forward -->
  <ellipse cx="382" cy="102" rx="38" ry="46" fill="#000000" transform="rotate(14 382 102)"/>
  <!-- Limbs + torso as bold flowing curves -->
  <g stroke="#000000" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Back arm: huge sweeping arc up and back to the left (the signature line) -->
    <path d="M 345 198 Q 235 158 80 252"/>
    <!-- Torso: lean from shoulder down to hip -->
    <path d="M 358 180 Q 330 252 290 322"/>
    <!-- Front arm: bent forward at the elbow -->
    <path d="M 350 200 Q 408 258 355 350"/>
    <!-- Front leg: lifted, knee high, foot punching forward -->
    <path d="M 290 322 Q 218 378 372 432"/>
    <!-- Back leg: extended back, push-off behind -->
    <path d="M 290 322 Q 282 412 132 470"/>
  </g>
</svg>
